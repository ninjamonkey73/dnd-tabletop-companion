<div class="newChar">
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>New Character Name</mat-label>
    <input
      matInput
      name="newCharacterName"
      type="text"
      [ngModel]="newCharacterName"
      (ngModelChange)="newCharacterNameChange.emit($event)"
      autocomplete="off"
      (keydown.enter)="create.emit()"
    />
  </mat-form-field>

  <button
    class="save-button"
    mat-flat-button
    (click)="create.emit()"
    aria-label="Save Character"
  >
    Save
  </button>

  <button
    class="cancel-button"
    mat-flat-button
    (click)="cancel.emit()"
    aria-label="Cancel"
  >
    Cancel
  </button>
</div>
